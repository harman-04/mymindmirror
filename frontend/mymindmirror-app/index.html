<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Primary Meta Tags -->
    <title>MyMindMirror – AI-Powered Journaling & Personal Growth</title>
    <meta name="title" content="MyMindMirror – AI-Powered Journaling & Personal Growth" />
    <meta name="description" content="Reflect, grow, and transform with AI‑powered journal analysis, smart roadmaps, gamification, and deep visual insights. Your private space for self‑discovery." />
    <meta name="keywords" content="journal, AI, self-reflection, mental health, goal tracking, roadmap, gamification, mood tracker, encryption" />
    <meta name="author" content="MyMindMirror" />

    <!-- 🌟 FIX: Defaulted to our new Master Palette dark void to prevent white-flashes -->
    <meta name="theme-color" content="#131127" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://mymindmirror.app/" />
    <meta property="og:title" content="MyMindMirror – AI-Powered Journaling & Personal Growth" />
    <meta property="og:description" content="Reflect, grow, and transform with AI‑powered journal analysis, smart roadmaps, gamification, and deep visual insights." />
    <meta property="og:image" content="/og-image.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://mymindmirror.app/" />
    <meta property="twitter:title" content="MyMindMirror – AI-Powered Journaling & Personal Growth" />
    <meta property="twitter:description" content="Reflect, grow, and transform with AI‑powered journal analysis, smart roadmaps, gamification, and deep visual insights." />
    <meta property="twitter:image" content="/og-image.png" />

    <!-- Favicon for older browsers -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icon.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />

    <!-- Preconnect to Google Fonts for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet" />

    <!-- Instant Image Preloading -->
    <link rel="preload" href="/login-bg-dark.webp" as="image" />
    <link rel="preload" href="/login-bg-light.webp" as="image" />
</head>
<!-- 🌟 FIX: Synced completely to the Enterprise 3-Layer Master Palette -->
<!-- slate-50 background for light mode, #131127 background for dark mode -->
<body class="bg-slate-50 text-slate-900 dark:bg-[#131127] dark:text-gray-100 transition-colors duration-500">
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
