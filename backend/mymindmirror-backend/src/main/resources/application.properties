# ==========================================
# SPRING BOOT CONFIGURATION
# ==========================================
spring.config.import=optional:file:.env[.properties]
spring.application.name=backend

# Server
server.port=${SERVER_PORT:8080}
server.address=0.0.0.0

# ==========================================
# SPRING AI - GOOGLE GEMINI
# ==========================================
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.options.model=gemini-2.5-flash-lite


# ==========================================
# POSTGRESQL (PGVECTOR)
# ==========================================
app.datasource.vector.url=${VECTOR_DB_URL}
app.datasource.vector.username=${VECTOR_DB_USERNAME}
app.datasource.vector.password=${VECTOR_DB_PASSWORD}
app.datasource.vector.driver-class-name=org.postgresql.Driver

# Spring AI Vector Store Settings
# This tells Spring Boot to automatically create the vector_store table in Postgres!
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=3072
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE


# ==========================================
# MYSQL DATABASE
# ==========================================
app.datasource.mysql.url=${DATASOURCE_URL:jdbc:mysql://localhost:3306/mymindmirror_db}
app.datasource.mysql.username=${DATASOURCE_USERNAME:root}
app.datasource.mysql.password=${DATASOURCE_PASSWORD:root}
app.datasource.mysql.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool settings (HikariCP)
#spring.datasource.hikari.connection-timeout=30000

# Connection pool settings (HikariCP)
# NOTE: These properties are IGNORED. The MySQL DataSource is manually constructed
# in MySqlDatabaseConfig and never reads spring.datasource.hikari.*.
# Actual settings live in MySqlDatabaseConfig.mysqlDataSource().
#spring.datasource.hikari.connection-timeout=5000
#spring.datasource.hikari.maximum-pool-size=10

#spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.maximum-pool-size=10

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
#spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
# Disable JPA open-in-view to prevent session issues
spring.jpa.open-in-view=false


# ==========================================
# JWT Secret Key (Crucial for Security!)
# ==========================================
jwt.secret=${JWT_SECRET}
jwt.expiration.ms=${JWT_EXPIRATION}


# ==========================================
# CORS Configuration (for React frontend)
# Comma-separated list of allowed origins (no trailing slash!)
# ==========================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost}

# ==========================================
# REDIS CACHE
# ==========================================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.cache.type=${SPRING_CACHE_TYPE:redis}
spring.data.redis.timeout=2000ms


# ==========================================
# ENCRYPTION Master key for field encryption (256-bit AES)
# ==========================================
app.encryption.master-key=${ENCRYPTION_MASTER_KEY}



# ==========================================
# RESPONSE COMPRESSION
# ==========================================
server.compression.enabled=${SERVER_COMPRESSION_ENABLED:true}
server.compression.mime-types=${SERVER_COMPRESSION_MIME_TYPES:application/json,application/javascript,text/css,text/html,text/plain}
server.compression.min-response-size=${SERVER_COMPRESSION_MIN_RESPONSE_SIZE:2048}


# ==========================================
# VIRTUAL THREADS
# ==========================================
spring.threads.virtual.enabled=true

# ==========================================
# RAG / SEMANTIC SEARCH
# ==========================================
rag.backfill.enabled=false

app.rag.similarity-threshold=0.55
app.rag.similarity-threshold-fallback=0.50
app.rag.top-k=10
app.rag.top-k-reflective=5
app.rag.top-k-fallback=4

# ==========================================
# ANOMALY DETECTION
# ==========================================
app.anomaly.ewma-span=7
app.anomaly.mood-threshold-std=0.6
app.anomaly.words-threshold-std=0.8
app.anomaly.min-days=7

# ==========================================
# ACTUATOR / HEALTH CHECKS
# ==========================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always


info.app.name=MyMindMirror Backend
info.app.version=@project.version@
info.app.description=MyMindMirror AI Journaling Backend

# ==========================================
# LOGGING (base — override per profile)
# ==========================================
logging.level.root=INFO
logging.level.com.mymindmirror=INFO

# ==========================================
# OpenAPI / Swagger UI
# ==========================================
# Path where the raw OpenAPI JSON spec is served
springdoc.api-docs.path=/v3/api-docs

# Path for the interactive Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html

# Sort operations alphabetically by HTTP method (GET, POST, PUT, DELETE)
springdoc.swagger-ui.operationsSorter=method

# Sort tags (controller groups) alphabetically
springdoc.swagger-ui.tagsSorter=alpha

# Show request execution time in the UI (helpful during development)
springdoc.swagger-ui.display-request-duration=true

# Try requests with no auth header by default (safer UX than auto-sending)
springdoc.swagger-ui.tryItOutEnabled=true

# Group every controller under a named tag (cleaner UI)
springdoc.swagger-ui.doc-expansion=none

# ==========================================
# Toggle for production
# ==========================================
# Set SWAGGER_ENABLED=false in production to disable both endpoints
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
# Keep the JWT in Swagger UI across page reloads during development
springdoc.swagger-ui.persistAuthorization=true
# ==========================================
# OTHER
# ==========================================
spring.sql.init.mode=never
backfill.enabled=false



# ==========================================
# Error Response Configuration
# ==========================================
# When true, includes a `debug_message` field in error responses.
# NEVER enable this in production.
app.error.expose-debug=false


#reencrypt.plaintext.enabled=true




