# ==========================================
# DEVELOPMENT PROFILE OVERRIDES
# Activate with SPRING_PROFILES_ACTIVE=dev
# ==========================================

# Verbose SQL and JPA logging for debugging
logging.level.org.hibernate.SQL=DEBUG
spring.jpa.properties.hibernate.format_sql=true

logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.org.hibernate.orm.jdbc.extract=TRACE

# Cache and web layer debugging
logging.level.org.springframework.cache=DEBUG
logging.level.org.springframework.data.redis.cache=INFO
logging.level.org.springframework.web.servlet.mvc.method.annotation.ResponseEntityExceptionHandler=INFO

logging.level.org.springframework.web.cors=DEBUG

# Expose debug_message in error responses (never in prod)
app.error.expose-debug=true