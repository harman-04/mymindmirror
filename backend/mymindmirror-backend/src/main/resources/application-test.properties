# ==========================================
# TEST PROFILE
# ==========================================

# Default datasource for slice tests
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 dialect — correct for slice tests
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Hibernate: create tables fresh for each test
spring.jpa.hibernate.ddl-auto=create-drop
#spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Redis fallback (overridden in container-based tests)
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Logging
#logging.level.springframework.test=DEBUG
logging.level.org.springframework.test=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.com.zaxxer.hikari=DEBUG

# ==========================================
# Required values for @Value injections in tests
# These override the ${ENV_VAR} placeholders in application.properties
# Safe to commit — they're test-only values, not production secrets
# ==========================================
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration.ms=86400000
app.encryption.master-key=MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
# Empty defaults for properties that would otherwise fail placeholder resolution
spring.ai.google.genai.api-key=test-dummy-key
spring.ai.google.genai.embedding.api-key=test-dummy-key
app.datasource.vector.url=jdbc:postgresql://localhost:5432/ignored
app.datasource.vector.username=ignored
app.datasource.vector.password=ignored