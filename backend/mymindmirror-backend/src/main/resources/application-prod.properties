# ==========================================
# PRODUCTION PROFILE OVERRIDES
# Activate with SPRING_PROFILES_ACTIVE=prod
# ==========================================

# Quiet logging — no SQL, no cache chatter, no exception stack traces
logging.level.root=WARN
logging.level.com.mymindmirror=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.springframework.cache=WARN
logging.level.org.springframework.data.redis.cache=WARN
logging.level.org.springframework.web.servlet.mvc.method.annotation.ResponseEntityExceptionHandler=WARN
logging.level.org.springframework.web=WARN

# Disable Swagger UI in production
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Never expose debug_message in production
app.error.expose-debug=false

# Do not show detailed health info to anonymous requests
management.endpoint.health.show-details=when-authorized

#spring.jpa.hibernate.ddl-auto=validate

spring.jpa.properties.hibernate.format_sql=false