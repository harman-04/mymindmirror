services:
  mysql:
    image: mysql:8.0
    container_name: mymindmirror-mysql
    restart: unless-stopped
    command: ["mysqld", "--log-bin-trust-function-creators=1"]
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mymindmirror_db
      MYSQL_USER: mymindmirror
      MYSQL_PASSWORD: mymindmirror
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: pgvector/pgvector:pg16
    container_name: mymindmirror-postgres
    environment:
      POSTGRES_DB: vectordb
      POSTGRES_USER: vector
      POSTGRES_PASSWORD: vectorpass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vector -d vectordb"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mymindmirror-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend/mymindmirror-backend
      dockerfile: Dockerfile
    container_name: mymindmirror-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Primary MySQL (transactional data)
      app.datasource.mysql.url: jdbc:mysql://mysql:3306/mymindmirror_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      app.datasource.mysql.username: mymindmirror
      app.datasource.mysql.password: mymindmirror
      # PostgreSQL (vector store)
      app.datasource.vector.url: jdbc:postgresql://postgres:5432/vectordb
      app.datasource.vector.username: vector
      app.datasource.vector.password: vectorpass
      # Redis
      spring.data.redis.host: redis
      spring.data.redis.port: 6379
      spring.cache.type: redis
      # JWT
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      # Spring AI Gemini API key (global fallback)
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      # Encryption master key for AES field encryption
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY}
      # CORS — override via environment for non-local deployments
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
      # Swagger / OpenAPI — enable in dev, set to "false" in production
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      # Error response — never enable in production
      app.error.expose-debug: "false"

      SPRING_PROFILES_ACTIVE: "prod"

    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend/mymindmirror-app
      dockerfile: Dockerfile
    container_name: mymindmirror-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
  postgres_data:
  redis_data: